name = "album-zip-worker"
main = "src/index.ts"
compatibility_date = "2026-03-01"
# Browser-callable signed download endpoint. Lives on a custom domain
# (zip.ninochavez.co) per the worker-domain convention — same root as the
# consuming app instead of a workers.dev URL. CORS locked to ALLOWED_ORIGIN.
workers_dev = false

[[routes]]
pattern = "zip.ninochavez.co"
custom_domain = true

[[r2_buckets]]
binding = "ZIP_CACHE"
bucket_name = "photo-gallery-zips"

# Per-IP rate limit on the zip endpoint (PERF-2). /api/zip-url is public+unauth and mints valid
# signatures freely, so cap request rate here to bound bandwidth / R2-egress abuse. period: 10 or 60.
[[ratelimits]]
name = "ZIP_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[vars]
CF_ACCOUNT_HASH = "wg34HB28-JkySWVm5fW4kA"
# Inbound CORS: the browser origin allowed to call this worker.
ALLOWED_ORIGIN = "https://ninochavez.co"
# Outbound: where the album manifest comes from. The Pages origin rather than ninochavez.co,
# because the zone's bot protection correctly refuses non-browser clients including this one.
# apps/router targets the same origin for the same reason.
PHOTOGRAPHY_ORIGIN = "https://nino-chavez-photography.pages.dev"

# Secrets (set via `wrangler secret put`):
#   ZIP_SIGNING_SECRET          — HMAC secret for the download URL
#   ZIP_SIGNING_SECRET_PREVIOUS — optional, only set while rotating the above
#
# That is the complete list, and it is meant to stay that way: this worker holds NO database
# credential. It used to carry SUPABASE_SERVICE_ROLE_KEY — the key that bypasses every RLS
# policy — purely to answer "which photos are in this album", which the gallery app already
# answers at /api/album-photos. Asking the app instead removed the credential and collapsed a
# second, drifting implementation of that query. See src/manifest.ts.
#
# ZIP_SIGNING_SECRET was itself split out of SUPABASE_SERVICE_ROLE_KEY on 2026-07-28, because
# /api/zip-url is unauthenticated and that made it an open oracle over the database credential.
# It lives in 1Password under `Cloudflare photography`, field `zip_signing_secret`.
