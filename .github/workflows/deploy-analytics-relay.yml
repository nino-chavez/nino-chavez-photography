name: Deploy analytics relay
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/analytics-relay/**'
      - '.github/workflows/deploy-analytics-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analytics-relay-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Analytics relay deployment skipped: deployment credentials are absent.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        name: Check relay and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --import tsx --test cloudflare-worker/analytics-relay/src/index.test.ts
          npx wrangler deploy --config cloudflare-worker/analytics-relay/wrangler.toml
